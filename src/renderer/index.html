<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Open Shark</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Barra de título propia (se arrastra para mover la ventana) -->
  <div class="titlebar"><img src="../main/assets/tray@2x.png" alt="" width="16" height="16"><span>Open Shark</span></div>

  <section id="empty-state" class="empty">
    <div class="empty-card">
      <div id="empty-mouse" class="empty-mouse"></div>
      <h1 data-i18n="empty.title"></h1>
      <p class="muted" data-i18n="empty.text"></p>
    </div>
  </section>

  <div id="shell" class="app" hidden>
    <!-- Arriba: ratones conectados, nombre del ratón con su estado, conexión y batería -->
    <header class="top">
      <nav id="device-switch" class="device-switch" data-i18n-aria-label="aria.devices"></nav>
      <div class="device">
        <input id="nickname" class="title" data-i18n-aria-label="aria.nickname" spellcheck="false">
        <span id="status-dot" class="dot" role="img" aria-labelledby="status-text"></span>
        <span id="status-text" class="sr-only"></span>
      </div>
      <span class="spacer"></span>
      <div id="top-chips" class="chips"></div>
    </header>

    <!-- Izquierda: secciones -->
    <nav class="rail" id="rail" role="tablist" data-i18n-aria-label="aria.sections"></nav>

    <!-- Centro: el ratón -->
    <section class="stage" id="stage">
      <div class="stage-title"><h1 id="sec-title"></h1><p id="sec-sub"></p></div>
      <div class="stage-fit" id="stage-fit"></div>
      <div class="stage-foot" id="stage-foot"></div>
    </section>

    <!-- Derecha: configuración de la sección -->
    <aside class="drawer">
      <div class="drawer-head"><small id="drawer-kicker"></small><h2 id="drawer-title"></h2></div>
      <div class="drawer-body" id="panel" role="tabpanel"></div>
      <!-- Solo aparece cuando hay cambios sin aplicar -->
      <div class="drawer-foot collapsed" id="drawer-foot" inert>
        <div class="foot-inner">
          <p id="dirty-text" class="dirty-text" data-i18n="foot.dirty"></p>
          <div class="foot-btns">
            <button class="btn ghost" id="discard" data-i18n="foot.discard"></button>
            <button class="btn primary" id="apply" data-i18n="foot.apply"></button>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- Confirmaciones y nombres -->
  <dialog id="dialog" class="modal">
    <form method="dialog">
      <h2 id="dialog-title"></h2>
      <p id="dialog-text" class="muted"></p>
      <input id="dialog-input" hidden>
      <menu>
        <button type="button" id="dialog-cancel" class="btn ghost" data-i18n="dialog.cancel"></button>
        <button value="ok" id="dialog-ok" class="btn primary"></button>
      </menu>
    </form>
  </dialog>

  <!-- Configuración del programa (no del ratón) -->
  <dialog class="modal settings" id="settings" aria-labelledby="settings-title">
    <header><h2 id="settings-title" data-i18n="settings.title"></h2>
      <button class="x" data-close data-i18n-aria-label="settings.close"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></header>
    <div class="body">
      <h3 data-i18n="settings.appearance"></h3>
      <div class="theme-pick" id="theme-pick">
        <button data-theme-opt="light" aria-pressed="false"><span class="swatch light"></span><span data-i18n="theme.light"></span></button>
        <button data-theme-opt="dark" aria-pressed="false"><span class="swatch dark"></span><span data-i18n="theme.dark"></span></button>
        <button data-theme-opt="system" aria-pressed="false"><span class="swatch auto"></span><span data-i18n="theme.system"></span></button>
      </div>
      <h3 data-i18n="settings.language"></h3>
      <div class="lang-pick" id="lang-pick" role="radiogroup" data-i18n-aria-label="settings.language"></div>
      <h3 data-i18n="settings.onClose"></h3>
      <div class="row"><span class="label"><span data-i18n="settings.tray"></span><small data-i18n="settings.trayHint"></small></span>
        <button class="switch" id="opt-tray" role="switch" aria-checked="false" data-i18n-aria-label="settings.tray"></button></div>
      <div class="row"><span class="label"><span data-i18n="settings.login"></span><small data-i18n="settings.loginHint"></small></span>
        <button class="switch" id="opt-login" role="switch" aria-checked="false" data-i18n-aria-label="settings.login"></button></div>
      <h3 data-i18n="settings.diag"></h3>
      <div class="row"><span class="label"><span data-i18n="settings.log"></span><small data-i18n="settings.logHint"></small></span>
        <button class="btn ghost small" id="open-logs" data-i18n="settings.openFolder"></button></div>
    </div>
    <footer><small id="app-version">Open Shark</small><button class="btn primary" data-close data-i18n="settings.done"></button></footer>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
